name: Auto-merge AI summaries to main

# 예약 작업(클라우드)은 프록시 제약으로 claude/* 브랜치에만 push할 수 있다.
# 이 워크플로가 그 브랜치의 js/summaries.js(및 캐시 버전용 index.html) 변경을
# main에 자동 반영하고 원본 claude/* 브랜치를 정리한다. (GitHub Pages는 main에서 배포)

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: auto-merge-summaries
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bring js/summaries.js (and index.html) from pushed branch into main
        env:
          SRC_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          echo "source branch: $SRC_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$SRC_BRANCH"

          # 안전장치: js/summaries.js·index.html(캐시 버전) 외 다른 파일이 바뀌었으면 자동 반영하지 않고 종료
          CHANGED=$(git diff --name-only main "origin/$SRC_BRANCH" || true)
          echo "changed files: $CHANGED"
          OTHER=$(echo "$CHANGED" | grep -v -e '^js/summaries.js$' -e '^index.html$' -e '^$' || true)
          if [ -n "$OTHER" ]; then
            echo "::warning::허용 목록(js/summaries.js·index.html) 외 변경이 있어 자동 머지를 건너뜁니다: $OTHER"
            exit 0
          fi

          git checkout "origin/$SRC_BRANCH" -- js/summaries.js index.html || { echo "no target files on branch"; exit 0; }
          if git diff --cached --quiet; then
            echo "변경 없음 — main 반영 스킵"
          else
            git commit -m "AI 지원가이드 자동 반영 (${SRC_BRANCH})"
            git push origin main
            echo "main 반영 완료"
          fi

      - name: Delete source claude/* branch
        if: always()
        env:
          SRC_BRANCH: ${{ github.ref_name }}
        run: |
          git push origin --delete "$SRC_BRANCH" || echo "브랜치 삭제 스킵/실패 (무시)"
