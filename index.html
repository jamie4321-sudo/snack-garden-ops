<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNACK &amp; GARDEN — OPS</title>
  <meta name="description" content="스낵앤가든 팀리더용 크루 관리 · 일정관리 운영 시스템" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=1" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./css/styles.css?v=79" />
  <script>
    // 페인트 전에 저장된 테마 적용 (깜빡임 방지)
    (function () {
      try {
        var t = localStorage.getItem("sg-theme");
        if (t === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    })();
    // 페인트 전에 저장된 인증 상태 적용 (깜빡임 방지)
    (function () {
      try {
        if (localStorage.getItem("sg-auth") === "ok") document.documentElement.setAttribute("data-authed", "1");
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- ============ LOCK SCREEN (관리자 로그인) ============ -->
  <div class="lock" id="lockScreen">
    <form class="lock__card lock__form" id="lockForm" autocomplete="off" novalidate>
      <div class="lock__brand">SNACK<em>&amp;</em>GARDEN</div>
      <p class="lock__label">관리자 로그인</p>

      <label class="lock__field">
        <span class="lock__ficon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </span>
        <input type="text" id="loginId" name="loginId" class="lock__text" placeholder="아이디" autocomplete="username" aria-label="아이디" />
      </label>

      <label class="lock__field">
        <span class="lock__ficon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </span>
        <input type="password" id="loginPw" name="loginPw" class="lock__text" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호" />
      </label>

      <p class="lock__error" id="lockError" hidden>아이디 또는 비밀번호가 올바르지 않습니다</p>

      <button type="submit" class="lock__submit" id="loginBtn">로그인</button>

      <label class="lock__remember">
        <input type="checkbox" id="loginRemember" checked /> <span>로그인 상태 유지</span>
      </label>
    </form>
  </div>

  <div class="layout">

    <!-- ============ SIDEBAR ============ -->
    <aside class="side">
      <a class="brand" href="#dashboard">
        <span class="brand__mark">SNACK<em>&amp;</em>GARDEN</span>
        <span class="brand__sub">OPS · 운영관리 시스템</span>
      </a>

      <nav class="nav" aria-label="주요 메뉴">
        <p class="nav__label">MAIN</p>
        <a class="nav__item" data-view="dashboard">대시보드</a>

        <p class="nav__label">CREW</p>
        <a class="nav__item" data-view="crew">크루 목록</a>
        <a class="nav__item" data-view="interview">면담 &amp; 근무기록</a>
        <a class="nav__item" data-view="attendance">근태 기록</a>
        <a class="nav__item" data-view="journal">면담일지 검토</a>
        <a class="nav__item" data-view="education">교육 관련</a>
        <a class="nav__item" data-view="hrchange">인사 변동</a>

        <p class="nav__label">OPERATION</p>
        <a class="nav__item" data-view="schedule">일정 관리</a>
        <a class="nav__item" data-view="workreport">업무 보고</a>
        <a class="nav__item" data-view="note">노트 기록</a>
        <a class="nav__item" data-view="notify">알림 설정</a>
        <a class="nav__item" data-view="statement">청구 관리</a>
        <a class="nav__item" data-view="partner">거래처 관리</a>
        <a class="nav__item" data-view="kpi">2026 KPI</a>

        <p class="nav__label">SYSTEM</p>
        <a class="nav__item is-soon">설정</a>
      </nav>

      <div class="side__foot">
        <span class="side__foot-status"><span class="dot"></span> DEMO · 목업 데이터</span>
        <button type="button" class="side__logout" id="logoutBtn" aria-label="로그아웃">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M15 12H5"/></svg>
          로그아웃
        </button>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <header class="topbar">
        <p class="topbar__crumb" id="viewTitle">SCHEDULE</p>
        <div class="topbar__right">
          <div class="search">
            <input type="search" placeholder="통합 검색" aria-label="통합 검색" />
            <kbd>/</kbd>
          </div>
          <button class="theme-toggle" id="themeToggle" aria-label="라이트/다크 테마 전환">
            <span class="knob"></span><span class="lbl">DARK</span>
          </button>
        </div>
      </header>

      <main class="view" id="view"><!-- rendered by app.js --></main>
    </div>

  </div>

  <script src="./js/config.js?v=48" defer></script>
  <script src="./js/data.js?v=56" defer></script>
  <script src="./js/summaries.js?v=17" defer></script>
  <script src="./js/kpi.js?v=1" defer></script>
  <script src="./js/app.js?v=84" defer></script>
  <script src="./js/voice-interview.js?v=2" defer></script>
</body>
</html>
